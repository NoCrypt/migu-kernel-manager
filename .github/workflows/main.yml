name: Build & Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust (aarch64-linux-android)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # Caches ~/.cargo registry/git + src/kmgr/target (deps and build artifacts)
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/kmgr -> target
          cache-on-failure: true

      # Prebuilt binary download, so no compile from source
      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('src/webui/bun.lock', 'src/webui/bun.lockb') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Cache WebUI node_modules
        uses: actions/cache@v4
        with:
          path: src/webui/node_modules
          key: webui-nm-${{ runner.os }}-${{ hashFiles('src/webui/bun.lock', 'src/webui/bun.lockb') }}

      - name: Locate Android NDK
        run: echo "ANDROID_NDK_HOME=${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}" >> "$GITHUB_ENV"

      - name: Build kmgr.zip
        run: |
          mkdir -p out
          bash build.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: kmgr
          path: out/kmgr.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          name: kmgr ${{ inputs.tag }}
          prerelease: ${{ inputs.prerelease }}
          files: out/kmgr.zip
          generate_release_notes: true
